<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Kyle Aldrich Taganna — Digital Business Card</title>
  <meta name="theme-color" content="#0d4db8" />
  <meta name="description" content="IT Student, Developer, and Startup Founder. Save contact and connect." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-1: #0a3ea8;
      --bg-2: #1e7ae8;
      --bg-3: #f2c230;
      --ink: #f7f4ee;
      --muted: rgba(247, 244, 238, 0.72);
      --gold: #f2c230;
      --panel: rgba(255, 255, 255, 0.1);
      --line: rgba(255, 255, 255, 0.2);
      --glass: rgba(8, 32, 92, 0.38);
      --shadow: 0 28px 70px rgba(8, 28, 90, 0.38);
      --radius: 22px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { min-height: 100%; }

    body {
      font-family: Manrope, system-ui, sans-serif;
      color: var(--ink);
      background: #0b3aa0;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .atmosphere {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(900px 560px at 14% -8%, rgba(242, 194, 48, 0.42) 0%, transparent 52%),
        radial-gradient(700px 480px at 92% 18%, rgba(255, 122, 51, 0.28) 0%, transparent 48%),
        radial-gradient(800px 520px at 50% 100%, rgba(8, 34, 120, 0.55) 0%, transparent 55%),
        linear-gradient(165deg, #2f8cf0 0%, #1a6de0 38%, #0d4db8 72%, #082e86 100%);
    }

    .atmosphere::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.28;
      background-image:
        linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: radial-gradient(circle at 50% 30%, #000 30%, transparent 80%);
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(40px);
      pointer-events: none;
      animation: drift 14s ease-in-out infinite;
    }

    .orb.a { width: 220px; height: 220px; background: rgba(242, 194, 48, 0.32); top: 8%; left: 8%; }
    .orb.b { width: 280px; height: 280px; background: rgba(47, 140, 240, 0.35); right: -40px; top: 18%; animation-delay: -4s; }
    .orb.c { width: 180px; height: 180px; background: rgba(255, 122, 51, 0.22); bottom: 8%; left: 40%; animation-delay: -8s; }

    @keyframes drift {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(18px, -22px) scale(1.08); }
    }

    main {
      position: relative;
      z-index: 1;
      width: min(440px, calc(100% - 32px));
      margin: 0 auto;
      padding: 36px 0 64px;
    }

    .card-wrap {
      opacity: 0;
      transform: translateY(18px) scale(0.985);
      animation: rise 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.08s forwards;
    }

    @keyframes rise {
      to { opacity: 1; transform: none; }
    }

    .portrait {
      position: relative;
      height: 430px;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: var(--shadow);
      isolation: isolate;
      transform-style: preserve-3d;
      transition: transform 0.35s ease, box-shadow 0.35s ease;
    }

    .portrait::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,0.16) 50%, transparent 65%);
      transform: translateX(-120%);
      animation: sheen 5.5s ease-in-out 1.2s infinite;
      pointer-events: none;
      z-index: 4;
    }

    @keyframes sheen {
      0%, 72%, 100% { transform: translateX(-120%); }
      86% { transform: translateX(120%); }
    }

    .art {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 70% 20%, rgba(230,195,106,0.22), transparent 42%),
        radial-gradient(ellipse at 20% 80%, rgba(70,120,180,0.28), transparent 50%),
        linear-gradient(160deg, #0d1a22 0%, #163024 55%, #0c1410 100%);
    }

    .art-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
      background-size: 28px 28px;
      opacity: 0.45;
    }

    .mark {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 1;
    }

    .mono {
      width: 168px;
      height: 168px;
      border-radius: 36px;
      display: grid;
      place-items: center;
      font-family: Syne, sans-serif;
      font-size: 64px;
      letter-spacing: -0.04em;
      color: #fff;
      background: linear-gradient(160deg, rgba(255,255,255,0.14), rgba(255,255,255,0.04));
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: 0 20px 50px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.2);
      backdrop-filter: blur(10px);
    }

    .ring {
      position: absolute;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      border: 1px solid rgba(230,195,106,0.28);
      animation: spin 18s linear infinite;
    }

    .ring::before {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      background: var(--gold);
      border-radius: 50%;
      top: -5px;
      left: 50%;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 18%;
      display: none;
      z-index: 2;
    }

    .photo.is-on { display: block; }

    .vignette {
      position: absolute;
      inset: 0;
      z-index: 3;
      background: linear-gradient(180deg, transparent 48%, rgba(8,12,8,0.72) 100%);
      pointer-events: none;
    }

    .identity {
      position: absolute;
      left: 22px;
      right: 22px;
      bottom: 22px;
      z-index: 5;
    }

    .gold-bar {
      width: 36px;
      height: 3px;
      border-radius: 99px;
      background: var(--gold);
      margin-bottom: 12px;
    }

    .identity h1 {
      font-family: Syne, sans-serif;
      font-size: clamp(28px, 7vw, 38px);
      font-weight: 800;
      letter-spacing: 0.04em;
      line-height: 0.95;
      text-transform: uppercase;
    }

    .identity .last {
      display: block;
      font-size: 0.52em;
      letter-spacing: 0.34em;
      margin-top: 8px;
      color: rgba(244,241,232,0.78);
      font-weight: 700;
    }

    .tagline {
      margin: 22px 0 18px;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--muted);
      text-transform: uppercase;
      opacity: 0;
      animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.22s forwards;
    }

    .quick {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-bottom: 22px;
      opacity: 0;
      animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.32s forwards;
    }

    .quick a, .quick button {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.92);
      display: grid;
      place-items: center;
      cursor: pointer;
      color: #111;
      text-decoration: none;
      box-shadow: 0 10px 24px rgba(0,0,0,0.18);
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.25s ease;
    }

    .quick a:hover, .quick button:hover,
    .quick a:focus-visible, .quick button:focus-visible {
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 16px 30px rgba(0,0,0,0.26);
      outline: none;
    }

    .quick svg { width: 24px; height: 24px; }

    .actions {
      display: grid;
      gap: 12px;
      opacity: 0;
      animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.42s forwards;
    }

    .save {
      height: 56px;
      border: 0;
      border-radius: 18px;
      background: #f7f4ee;
      color: #171717;
      font: inherit;
      font-weight: 700;
      font-size: 15.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(0,0,0,0.18);
      transition: transform 0.22s ease, box-shadow 0.22s ease;
    }

    .save:hover { transform: translateY(-2px); box-shadow: 0 16px 34px rgba(0,0,0,0.24); }
    .save:active { transform: translateY(0) scale(0.985); }
    .save svg { width: 22px; height: 22px; }

    .link {
      height: 56px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: var(--glass);
      backdrop-filter: blur(16px);
      color: var(--ink);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      font-weight: 800;
      letter-spacing: 0.08em;
      font-size: 13px;
      text-transform: uppercase;
      transition: transform 0.22s ease, background 0.22s ease, border-color 0.22s ease;
    }

    .link:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.28);
    }

    .link .ico {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
    }

    .link .ico svg { width: 18px; height: 18px; }
    .link .label { flex: 1; min-width: 0; }
    .chev {
      margin-left: auto;
      flex: 0 0 auto;
      opacity: 0.55;
      font-size: 18px;
      line-height: 1;
    }

    .review-stage {
      position: relative;
      margin: 26px auto 0;
      width: min(730px, 100%);
      perspective: 1200px;
    }

    .review-card {
      position: relative;
      width: 100%;
      max-width: 690px;
      margin: 0 auto;
      background: linear-gradient(180deg, #0b4aa8 0%, #0d3f96 100%);
      border-radius: 30px;
      border: 3px solid rgba(255,255,255,0.16);
      box-shadow: 0 30px 70px rgba(0,0,0,0.28), 0 0 40px rgba(30, 130, 255, 0.2);
      padding: 32px 26px 30px;
      overflow: hidden;
      transform: rotateX(2deg);
    }

    .review-card::before {
      content: "";
      position: absolute;
      inset: -12% 4% auto 4%;
      height: 120%;
      background: linear-gradient(110deg, rgba(255,255,255,0.12), rgba(255,255,255,0.02), rgba(255,255,255,0.08));
      transform: rotate(-4deg);
      pointer-events: none;
      filter: blur(2px);
    }

    .review-card::after {
      content: "";
      position: absolute;
      inset: auto 0 0 0;
      height: 20px;
      background: linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,0.15));
      pointer-events: none;
    }

    .stars {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 0 auto 16px;
      font-size: clamp(28px, 4vw, 42px);
      color: #f7d14a;
      text-shadow: 0 2px 10px rgba(242, 194, 48, 0.4);
      filter: drop-shadow(0 3px 0 rgba(163, 117, 0, 0.6));
    }

    .stars span { display: inline-block; }

    .headline {
      position: relative;
      z-index: 1;
      text-align: center;
      font-weight: 800;
      line-height: 0.96;
      font-size: clamp(30px, 4vw, 58px);
      letter-spacing: -0.04em;
      text-transform: uppercase;
      color: #f7f4ee;
      margin: 0 auto 18px;
      max-width: 620px;
      font-family: "Arial Black", Impact, sans-serif;
    }

    .google-box {
      position: relative;
      z-index: 1;
      width: min(360px, 62%);
      height: 210px;
      margin: 8px auto 16px;
      background: #f5f5f5;
      border-radius: 46% 46% 24% 24% / 58% 58% 24% 24%;
      box-shadow: inset 0 -10px 18px rgba(0,0,0,0.06), 0 18px 30px rgba(6,39,96,0.14);
      position: relative;
      overflow: hidden;
    }

    .google-box::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 54px;
      background: linear-gradient(180deg, rgba(79,204,255,0.7), rgba(0,150,255,0.8));
      border-radius: 50% 50% 30% 30% / 80% 80% 20% 20%;
      transform: translateY(18px);
    }

    .google-g {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 168px;
      height: 168px;
      transform: translate(-50%, -54%);
      border-radius: 50%;
      background: linear-gradient(180deg, #f5f5f5, #efefef);
      box-shadow: inset 0 0 0 12px #f5f5f5;
    }

    .google-g::before,
    .google-g::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
    }

    .google-g::before {
      background: conic-gradient(from 210deg, #4285F4 0 27%, #34A853 27% 56%, #FBBC05 56% 78%, #EA4335 78% 100%);
      -webkit-mask: radial-gradient(circle at center, transparent 0 46%, #000 47% 66%, transparent 67%);
              mask: radial-gradient(circle at center, transparent 0 46%, #000 47% 66%, transparent 67%);
      transform: rotate(20deg);
    }

    .google-g::after {
      background: #f5f5f5;
      -webkit-mask: radial-gradient(circle at center, transparent 0 56%, #000 57% 100%);
              mask: radial-gradient(circle at center, transparent 0 56%, #000 57% 100%);
      transform: translate(28px, 0);
    }

    .tap-text {
      position: relative;
      z-index: 1;
      margin-top: 10px;
      text-align: center;
      color: #111;
      font-family: "Segoe Print", "Bradley Hand", cursive;
      font-weight: 700;
      font-size: clamp(20px, 2vw, 32px);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-style: italic;
    }

    .tap-text .word1 {
      font-family: "Segoe Print", "Bradley Hand", cursive;
      letter-spacing: 0.08em;
    }

    .tap-text .word2 {
      display: inline-block;
      margin-left: 6px;
    }

    .nfc-scene {
      position: relative;
      z-index: 1;
      width: min(510px, 82%);
      height: 210px;
      margin: 12px auto 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nfc-ring {
      position: absolute;
      width: 210px;
      height: 210px;
      border: 5px solid #111;
      border-radius: 50%;
      left: 50%;
      transform: translateX(-120%);
      display: grid;
      place-items: center;
    }

    .nfc-ring::before,
    .nfc-ring::after {
      content: "";
      position: absolute;
      border: 4px solid #111;
      border-color: #111 transparent transparent transparent;
      border-radius: 50%;
    }

    .nfc-ring::before {
      width: 168px; height: 168px;
      transform: rotate(22deg);
    }

    .nfc-ring::after {
      width: 122px; height: 122px;
      transform: rotate(-18deg);
    }

    .wave {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 13px;
      height: 160px;
      transform: translate(-50%, -50%);
      border-radius: 999px;
    }

    .wave::before,
    .wave::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 999px;
      border: 4px solid #111;
      border-color: rgba(17,17,17,0.95) transparent transparent transparent;
      transform: rotate(0deg);
    }

    .wave::before {
      width: 120px;
      height: 120px;
      left: -54px;
      top: 20px;
    }

    .wave::after {
      width: 84px;
      height: 84px;
      left: -36px;
      top: 36px;
    }

    .phone-illustration {
      position: absolute;
      right: 19%;
      bottom: 18px;
      width: 135px;
      height: 180px;
      border: 5px solid #111;
      border-radius: 14px;
      background: rgba(255,255,255,0.04);
      transform: rotate(12deg);
      box-shadow: inset 0 0 0 2px rgba(17,17,17,0.08);
    }

    .phone-illustration::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 16px;
      transform: translateX(-50%);
      width: 16px;
      height: 6px;
      background: #111;
      border-radius: 3px;
    }

    .phone-illustration::after {
      content: "";
      position: absolute;
      inset: 26px 14px 12px;
      border-radius: 10px;
      background: linear-gradient(180deg, rgba(17,17,17,0.04), rgba(17,17,17,0.08));
    }

    .phone-illustration .nfc {
      position: absolute;
      right: -16px;
      top: 54px;
      color: #111;
      font-family: Arial, sans-serif;
      font-weight: 800;
      font-size: 26px;
      letter-spacing: -0.04em;
      transform: rotate(-8deg);
    }

    .hand {
      position: absolute;
      right: 4%;
      bottom: 0;
      width: 186px;
      height: 132px;
      border: 5px solid #111;
      border-color: transparent transparent #111 transparent;
      border-radius: 55% 45% 60% 40% / 80% 80% 20% 20%;
      transform: rotate(22deg);
      opacity: 0.95;
    }

    .hand::before {
      content: "";
      position: absolute;
      width: 72px;
      height: 40px;
      border: 5px solid #111;
      border-top: none;
      border-radius: 0 0 25px 25px;
      right: 10px;
      bottom: 34px;
      transform: rotate(8deg);
    }

    .hand::after {
      content: "";
      position: absolute;
      width: 76px;
      height: 32px;
      border: 5px solid #111;
      border-left: none;
      border-radius: 0 30px 22px 0;
      right: -12px;
      bottom: 14px;
      transform: rotate(14deg);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translate(-50%, 16px);
      background: #111;
      color: #fff;
      padding: 12px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      z-index: 20;
      transition: 0.28s ease;
      box-shadow: 0 12px 30px rgba(0,0,0,0.3);
    }

    .toast.on {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 600px) {
      .review-card { padding-left: 18px; padding-right: 18px; }
      .headline { max-width: 430px; }
      .google-box { width: min(290px, 80%); }
      .nfc-scene { width: min(400px, 100%); }
      .nfc-ring { transform: translateX(-110%); }
      .phone-illustration { right: 15%; }
      .hand { right: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
      .card-wrap, .tagline, .quick, .actions { opacity: 1; transform: none; }
    }
  </style>
</head>

    const toast = (msg) => {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("on");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove("on"), 2200);
    };

    const vcard = () => [
      "BEGIN:VCARD",
      "VERSION:3.0",
      `N:${CARD.lastName};${CARD.firstName};;;`,
      `FN:${CARD.fullName}`,
      `COMPANY:${"FLEXSHARE"}`,
      `TITLE:${"CEO - Founder"}`,
      `EMAIL;TYPE=INTERNET:${CARD.email}`,
      `URL:${CARD.github}`,
      `X-SOCIALPROFILE;TYPE=instagram:${CARD.instagram}`,
      `X-SOCIALPROFILE;TYPE=facebook:${CARD.facebook}`,
      `X-SOCIALPROFILE;TYPE=tiktok:${CARD.tiktok}`,
      "END:VCARD",
    ].join("\r\n");

    document.getElementById("saveBtn").addEventListener("click", () => {
      const blob = new Blob([vcard()], { type: "text/vcard;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "Kyle-Aldrich-Taganna.vcf";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      toast("Contact file ready");
    });

    const portrait = document.getElementById("portrait");
    portrait.addEventListener("pointermove", (e) => {
      const r = portrait.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - 0.5;
      const y = (e.clientY - r.top) / r.height - 0.5;
      portrait.style.transform = `rotateY(${x * 8}deg) rotateX(${-y * 6}deg)`;
    });
    portrait.addEventListener("pointerleave", () => {
      portrait.style.transform = "";
    });
