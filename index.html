<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Kyle Aldrich Taganna — Digital Business Card</title>
  <meta name="theme-color" content="#0d4db8" />
  <meta name="description" content="IT Student, Developer, and Startup Founder. Save contact and connect." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-1: #0a3ea8;
      --bg-2: #1e7ae8;
      --bg-3: #f2c230;
      --ink: #f7f4ee;
      --muted: rgba(247, 244, 238, 0.72);
      --gold: #f2c230;
      --panel: rgba(255, 255, 255, 0.1);
      --line: rgba(255, 255, 255, 0.2);
      --glass: rgba(8, 32, 92, 0.38);
      --shadow: 0 28px 70px rgba(8, 28, 90, 0.38);
      --radius: 22px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { min-height: 100%; }

    body {
      font-family: Manrope, system-ui, sans-serif;
      color: var(--ink);
      background: #0b3aa0;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .atmosphere {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(900px 560px at 14% -8%, rgba(242, 194, 48, 0.42) 0%, transparent 52%),
        radial-gradient(700px 480px at 92% 18%, rgba(255, 122, 51, 0.28) 0%, transparent 48%),
        radial-gradient(800px 520px at 50% 100%, rgba(8, 34, 120, 0.55) 0%, transparent 55%),
        linear-gradient(165deg, #2f8cf0 0%, #1a6de0 38%, #0d4db8 72%, #082e86 100%);
    }

    .atmosphere::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.28;
      background-image:
        linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: radial-gradient(circle at 50% 30%, #000 30%, transparent 80%);
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(40px);
      pointer-events: none;
      animation: drift 14s ease-in-out infinite;
    }

    .orb.a { width: 220px; height: 220px; background: rgba(242, 194, 48, 0.32); top: 8%; left: 8%; }
    .orb.b { width: 280px; height: 280px; background: rgba(47, 140, 240, 0.35); right: -40px; top: 18%; animation-delay: -4s; }
    .orb.c { width: 180px; height: 180px; background: rgba(255, 122, 51, 0.22); bottom: 8%; left: 40%; animation-delay: -8s; }

    @keyframes drift {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(18px, -22px) scale(1.08); }
    }

    main {
      position: relative;
      z-index: 1;
      width: min(440px, calc(100% - 32px));
      margin: 0 auto;
      padding: 36px 0 64px;
    }

    .card-wrap {
      opacity: 0;
      transform: translateY(18px) scale(0.985);
      animation: rise 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.08s forwards;
    }

    @keyframes rise {
      to { opacity: 1; transform: none; }
    }

    .portrait {
      position: relative;
      height: 430px;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: var(--shadow);
      isolation: isolate;
      transform-style: preserve-3d;
      transition: transform 0.35s ease, box-shadow 0.35s ease;
    }

    .portrait::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,0.16) 50%, transparent 65%);
      transform: translateX(-120%);
      animation: sheen 5.5s ease-in-out 1.2s infinite;
      pointer-events: none;
      z-index: 4;
    }

    @keyframes sheen {
      0%, 72%, 100% { transform: translateX(-120%); }
      86% { transform: translateX(120%); }
    }

    .art {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 70% 20%, rgba(230,195,106,0.22), transparent 42%),
        radial-gradient(ellipse at 20% 80%, rgba(70,120,180,0.28), transparent 50%),
        linear-gradient(160deg, #0d1a22 0%, #163024 55%, #0c1410 100%);
    }

    .art-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
      background-size: 28px 28px;
      opacity: 0.45;
    }

    .mark {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 1;
    }

    .mono {
      width: 168px;
      height: 168px;
      border-radius: 36px;
      display: grid;
      place-items: center;
      font-family: Syne, sans-serif;
      font-size: 64px;
      letter-spacing: -0.04em;
      color: #fff;
      background: linear-gradient(160deg, rgba(255,255,255,0.14), rgba(255,255,255,0.04));
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: 0 20px 50px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.2);
      backdrop-filter: blur(10px);
    }

    .ring {
      position: absolute;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      border: 1px solid rgba(230,195,106,0.28);
      animation: spin 18s linear infinite;
    }

    .ring::before {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      background: var(--gold);
      border-radius: 50%;
      top: -5px;
      left: 50%;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 18%;
      display: none;
      z-index: 2;
    }

    .photo.is-on { display: block; }

    .vignette {
      position: absolute;
      inset: 0;
      z-index: 3;
      background: linear-gradient(180deg, transparent 48%, rgba(8,12,8,0.72) 100%);
      pointer-events: none;
    }

    .identity {
      position: absolute;
      left: 22px;
      right: 22px;
      bottom: 22px;
      z-index: 5;
    }

    .gold-bar {
      width: 36px;
      height: 3px;
      border-radius: 99px;
      background: var(--gold);
      margin-bottom: 12px;
    }

    .identity h1 {
      font-family: Syne, sans-serif;
      font-size: clamp(28px, 7vw, 38px);
      font-weight: 800;
      letter-spacing: 0.04em;
      line-height: 0.95;
      text-transform: uppercase;
    }

    .identity .last {
      display: block;
      font-size: 0.52em;
      letter-spacing: 0.34em;
      margin-top: 8px;
      color: rgba(244,241,232,0.78);
      font-weight: 700;
    }

    .tagline {
      margin: 22px 0 18px;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--muted);
      text-transform: uppercase;
      opacity: 0;
      animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.22s forwards;
    }

    .quick {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-bottom: 22px;
      opacity: 0;
      animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.32s forwards;
    }

    .quick a, .quick button {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.92);
      display: grid;
      place-items: center;
      cursor: pointer;
      color: #111;
      text-decoration: none;
      box-shadow: 0 10px 24px rgba(0,0,0,0.18);
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.25s ease;
    }

    .quick a:hover, .quick button:hover,
    .quick a:focus-visible, .quick button:focus-visible {
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 16px 30px rgba(0,0,0,0.26);
      outline: none;
    }

    .quick svg { width: 24px; height: 24px; }

    .actions {
      display: grid;
      gap: 12px;
      opacity: 0;
      animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.42s forwards;
    }

    .save {
      height: 56px;
      border: 0;
      border-radius: 18px;
      background: #f7f4ee;
      color: #171717;
      font: inherit;
      font-weight: 700;
      font-size: 15.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(0,0,0,0.18);
      transition: transform 0.22s ease, box-shadow 0.22s ease;
    }

    .save:hover { transform: translateY(-2px); box-shadow: 0 16px 34px rgba(0,0,0,0.24); }
    .save:active { transform: translateY(0) scale(0.985); }
    .save svg { width: 22px; height: 22px; }

    .link {
      height: 56px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: var(--glass);
      backdrop-filter: blur(16px);
      color: var(--ink);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      font-weight: 800;
      letter-spacing: 0.08em;
      font-size: 13px;
      text-transform: uppercase;
      transition: transform 0.22s ease, background 0.22s ease, border-color 0.22s ease;
    }

    .link:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.28);
    }

    .link .ico {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
    }

    .link .ico svg { width: 18px; height: 18px; }
    .link .label { flex: 1; min-width: 0; }
    .chev {
      margin-left: auto;
      flex: 0 0 auto;
      opacity: 0.55;
      font-size: 18px;
      line-height: 1;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translate(-50%, 16px);
      background: #111;
      color: #fff;
      padding: 12px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      z-index: 20;
      transition: 0.28s ease;
      box-shadow: 0 12px 30px rgba(0,0,0,0.3);
    }

    .toast.on {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
      .card-wrap, .tagline, .quick, .actions { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>

  <div class="toast" id="toast" role="status"></div>

  <script>
    const CARD = {
      firstName: "Kyle Aldrich",
      lastName: "Taganna",
      fullName: "Kyle Aldrich Taganna",
      title: "IT Student | Developer | Startup Founder",
      email: "aldrichkyle879@gmail.com",
      instagram: "https://www.instagram.com/not__kaii_",
      facebook: "https://www.facebook.com/profile.php?id=61585444767869",
      tiktok: "https://www.tiktok.com/@notkai_8",
      github: "https://github.com/kaiiiiii0292",
    };

    const toast = (msg) => {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("on");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove("on"), 2200);
    };

    const vcard = () => [
      "BEGIN:VCARD",
      "VERSION:3.0",
      `N:${CARD.lastName};${CARD.firstName};;;`,
      `FN:${CARD.fullName}`,
      `COMPANY:${"FLEXSHARE"}`,
      `TITLE:${"CEO - Founder"}`,
      `EMAIL;TYPE=INTERNET:${CARD.email}`,
      `URL:${CARD.github}`,
      `X-SOCIALPROFILE;TYPE=instagram:${CARD.instagram}`,
      `X-SOCIALPROFILE;TYPE=facebook:${CARD.facebook}`,
      `X-SOCIALPROFILE;TYPE=tiktok:${CARD.tiktok}`,
      "END:VCARD",
    ].join("\r\n");

    document.getElementById("saveBtn").addEventListener("click", () => {
      const blob = new Blob([vcard()], { type: "text/vcard;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "Kyle-Aldrich-Taganna.vcf";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      toast("Contact file ready");
    });

    const portrait = document.getElementById("portrait");
    portrait.addEventListener("pointermove", (e) => {
      const r = portrait.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - 0.5;
      const y = (e.clientY - r.top) / r.height - 0.5;
      portrait.style.transform = `rotateY(${x * 8}deg) rotateX(${-y * 6}deg)`;
    });
    portrait.addEventListener("pointerleave", () => {
      portrait.style.transform = "";
    });
  </script>
